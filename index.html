        <h1>Ocular Camera for iPhone &amp; iPad — Film Recipe &amp; RAW Rangefinder Camera App</h1>
        <p><strong>Live film recipes &amp; RAW camera for iPhone.</strong> Ocular Camera turns your iPhone and iPad into a tactile digital rangefinder where you preview custom analog film looks live in the viewfinder, capture Bayer RAW (DNG) or Apple ProRAW, and re-develop any RAW shot non-destructively in the built-in darkroom.</p>
        <h2>Key Features</h2>
        <ul>
          <li><strong>12 Live Analog Film Looks:</strong> Standard (<code>STD</code>), Calm Chrome (<code>CC</code>), Ash Charcoal Monochrome (<code>AC</code>), Color Negative (<code>CN</code>), Nouveau Negative (<code>NN</code>), Realistic Ambient (<code>RA</code>), Ethereal Tone (<code>ET</code>), Vivid Valley (<code>VV</code>), Airy Soft (<code>AS</code>), Portrait Neutral High (<code>PNH</code>), Portrait Neutral Standard (<code>PNS</code>), and Sepia Warm (<code>SEP</code>).</li>
          <li><strong>Custom Film Recipes (Slots C1–C7):</strong> Dial in White Balance Kelvin + Red/Blue matrix shift, Highlight &amp; Shadow tone curves, Dynamic Range protection (<code>DR100</code>, <code>DR200</code>, <code>DR400</code>), organic 35mm film grain, and optical highlight halation.</li>
          <li><strong>Rangefinder Hardware Controls:</strong> Tactile Exposure Compensation (<code>-3.0 to +3.0 EV</code>), prime lens focal lengths (<code>13mm</code>, <code>24mm</code>, <code>28mm</code>, <code>35mm</code>, <code>50mm</code>, <code>77mm</code>), AF/AE lock, customizable <code>F1–F4</code> function keys, and aspect ratios including <code>4:3</code>, <code>3:2</code>, <code>1:1</code>, <code>16:9</code>, and <code>65:24</code> panoramic framing.</li>
          <li><strong>RAW &amp; ProRAW Darkroom:</strong> Capture pure sensor Bayer RAW (DNG) or Apple ProRAW with recipe telemetry preserved in EXIF, and re-develop any RAW photo with a new film look after capture.</li>
          <li><strong>Free &amp; Pro Tiers · Zero Accounts · 100% On-Device:</strong> Start free with 3 film stocks, custom slot <code>C1</code>, manual controls, and no watermark. Upgrade to Ocular Pro for full-res output and all Pro tools via Monthly, Annual (3-day free trial), or a one-time Lifetime unlock.</li>
        </ul>
